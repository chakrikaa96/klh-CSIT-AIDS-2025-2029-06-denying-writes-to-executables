# ExecGuard policy file
# ---------------------
# Syntax (one directive per line; '#' begins a comment):
#
#   PROTECT <path-or-glob>    Protect a file or every executable matching a glob.
#                             Globs are expanded by the daemon at load time into
#                             concrete files; each is resolved to a (dev,inode)
#                             identity and enforced in the kernel.
#
#   TRUST   <executable>      Allow this executable (identified by its inode) to
#                             modify protected files. Must be a real ELF binary,
#                             NOT a shell script (a script's identity is the
#                             interpreter, e.g. bash - far too broad).
#
#   MODE    enforce|audit     Global default. 'enforce' blocks; 'audit' logs
#                             what WOULD be blocked without blocking it.
#
#   DENY    user=<name>       Reserved for future userspace enforcement.
#
# Start conservative. On a fresh install, prefer MODE audit for a day, review
# the audit log, then switch to MODE enforce.

MODE enforce

# --- System executables (uncomment to protect the real system; test first) --
# PROTECT /usr/bin/*
# PROTECT /usr/sbin/*
# PROTECT /bin/*
# PROTECT /sbin/*

# --- Trusted updaters -------------------------------------------------------
# These are the legitimate package managers on Debian/Ubuntu systems.
# TRUST /usr/bin/apt
# TRUST /usr/bin/apt-get
# TRUST /usr/bin/dpkg

# --- Demo (safe; created by src/scripts/demo.sh) --------------------------------
PROTECT /opt/execguard-demo/protected/app
PROTECT /opt/execguard-demo/protected/script.sh
TRUST   /opt/execguard-demo/eg-updater
