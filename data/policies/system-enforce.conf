# ExecGuard policy: protect system executables in enforce mode.
#
# Intended for a test VM (for example the Multipass "execguard-test" instance)
# after the audit rollout in audit-rollout.conf has shown no unexpected writers.
# Package-manager binaries are trusted so that "apt upgrade" keeps working.
#
# Note: apt runs dpkg, and dpkg performs the actual file replacement. Both are
# trusted because trust is evaluated against the executable of the task doing
# the write, not its parent.

MODE enforce

PROTECT /usr/bin/*
PROTECT /usr/sbin/*
PROTECT /usr/local/bin/*

TRUST /usr/bin/dpkg
TRUST /usr/bin/apt
TRUST /usr/bin/apt-get
