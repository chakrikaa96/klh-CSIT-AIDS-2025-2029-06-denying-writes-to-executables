# ExecGuard policy: audit-only rollout.
#
# Identical scope to system-enforce.conf, but MODE audit. Every operation that
# would be denied is allowed and recorded with decision "AUDIT" in
# /var/log/execguard/audit.jsonl. Review that log (egctl logs -n 200) for
# legitimate writers that must be trusted before switching to enforce mode.

MODE audit

PROTECT /usr/bin/*
PROTECT /usr/sbin/*
PROTECT /usr/local/bin/*

TRUST /usr/bin/dpkg
TRUST /usr/bin/apt
TRUST /usr/bin/apt-get
